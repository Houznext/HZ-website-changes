# Railway uses Nixpacks by default (see railway.json).
# Chromium is required for invoice PDF generation (Puppeteer).
[phases.setup]
aptPkgs = [
  "chromium",
  "fonts-liberation",
  "fonts-noto-core",
  "ca-certificates",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpangocairo-1.0-0",
  "libgtk-3-0",
]

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
